# Deploys this infra repo (Caddyfile, compose.yaml, static sites) to the Droplet.
#
# Repo secrets required:
#   DEPLOY_HOST         Droplet IP (or glennreilly.net once DNS is live)
#   DEPLOY_SSH_KEY      private key for the `deploy` user
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <droplet-ip>`
name: Deploy infra

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync files
        run: |
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'templates/' --exclude 'tools/' \
            --exclude '.env' \
            ./ deploy@${{ secrets.DEPLOY_HOST }}:/opt/demos/

      - name: Restart stack
        run: ssh deploy@${{ secrets.DEPLOY_HOST }} 'bash /opt/demos/scripts/deploy.sh all'
